<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="medalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Cintas -->
  <polygon points="35,15 50,50 40,50 25,15" fill="url(#ribbonGrad)" />
  <polygon points="65,15 50,50 60,50 75,15" fill="#ef4444" />
  <!-- Medalla circular -->
  <circle cx="50" cy="65" r="25" fill="url(#medalGrad)" stroke="#ca8a04" stroke-width="3" />
  <circle cx="50" cy="65" r="20" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3,2" />
  <!-- Número 1 central -->
  <text x="50" y="73" font-size="22" font-family="'Fredoka', Arial, sans-serif" font-weight="900" fill="#854d0e" text-anchor="middle">1</text>
</svg>
