<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIS TABLAS - ¡Aprende Multiplicar Jugando!</title>
  <link rel="stylesheet" href="Sistema/CSS/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fondo animado con números y símbolos matemáticos flotantes -->
  <div class="background-floating-shapes">
    <div class="floating-shape" style="left: 10%; animation-duration: 12s; animation-delay: 0s;">×</div>
    <div class="floating-shape" style="left: 25%; animation-duration: 16s; animation-delay: 2s;">7</div>
    <div class="floating-shape" style="left: 40%; animation-duration: 11s; animation-delay: 5s;">⭐</div>
    <div class="floating-shape" style="left: 60%; animation-duration: 14s; animation-delay: 1s;">9</div>
    <div class="floating-shape" style="left: 75%; animation-duration: 13s; animation-delay: 3s;">×</div>
    <div class="floating-shape" style="left: 90%; animation-duration: 15s; animation-delay: 4s;">4</div>
    <div class="floating-shape" style="left: 80%; animation-duration: 17s; animation-delay: 7s;">✨</div>
  </div>

  <!-- Tarjeta Central de Ingreso del Estudiante -->
  <div class="login-card">
    <header class="brand-header">
      <div class="logo-wrapper">
        <span class="logo-icon">🚀</span>
      </div>
      <h1 class="platform-title">MIS TABLAS</h1>
      <p class="platform-subtitle">Plataforma Educativa Interactiva de Matemáticas</p>
      <span class="badge-course">Diseñado para 4° Básico • SIMCE</span>
    </header>

    <!-- Alerta de validación amigable -->
    <div class="alert-error" id="errorAlert"></div>

    <form id="loginForm" autocomplete="off">
      <!-- Campo Nombre del Estudiante -->
      <div class="form-group">
        <label for="studentName" class="form-label">¿Cómo te llamas, explorador(a)?</label>
        <div class="input-container">
          <span class="input-icon">✏️</span>
          <input 
            type="text" 
            id="studentName" 
            class="form-input" 
            placeholder="Escribe tu nombre o apodo aquí..." 
            maxlength="25"
            required
          >
        </div>
      </div>

      <!-- Selección de Avatar Infantil -->
      <div class="avatar-section">
        <label class="form-label">Elige tu Avatar de Aventura:</label>
        <div class="avatar-grid" id="avatarGrid">
          <!-- Se cargan dinámicamente desde JS -->
        </div>
      </div>

      <!-- Botón de Ingreso -->
      <button type="submit" class="btn-enter" id="btnEnter">
        <span>¡Comenzar la Aventura!</span>
        <span style="font-size: 1.4rem;">🎮</span>
      </button>
    </form>

    <footer class="login-footer">
      <p>Aprende las tablas del 2 al 10 • Juegos • Desafíos • Ensayo SIMCE</p>
      <p style="margin-top: 4px; opacity: 0.7;">Departamento de Informática</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="Sistema/JS/storage.js"></script>
  <script src="Sistema/JS/audio.js"></script>
  <script src="Sistema/JS/login.js"></script>
</body>
</html>
